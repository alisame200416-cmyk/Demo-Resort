name: Pull request checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["codex/-demo-resort-github-pages"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify dist
        run: test -f dist/index.html
