name: Recover showcase photos
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch existing photo metadata read-only
        run: |
          cfg="$(curl -sSL https://raw.githubusercontent.com/alisame200416-cmyk/maryam/main/firebase-applet-config.json)"
          key="$(printf '%s' "$cfg" | jq -r '.apiKey // empty')"
          curl -sSL "https://firestore.googleapis.com/v1/projects/maryam-resort/databases/(default)/documents/resort_images?key=$key" -o recovery-images.json
      - name: Commit recovery metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovery-images.json
          git diff --cached --quiet && exit 0
          git commit -m "Capture existing showcase photo metadata"
          git push
